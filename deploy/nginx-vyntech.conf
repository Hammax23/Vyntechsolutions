# VynTech Solutions — Next.js (port 3005)
# Preferred host: https://vyntechsolutions.ca (non-www)
#
# Install:
#   sudo cp deploy/nginx-vyntech.conf /etc/nginx/sites-available/vyntechsolutions
#   sudo ln -sf /etc/nginx/sites-available/vyntechsolutions /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL: cert must cover BOTH apex + www (certbot --nginx -d vyntechsolutions.ca -d www.vyntechsolutions.ca)
# If Certbot already manages this file, merge the www→apex 301 server blocks below into the live config.

# --------------------------------------------------------------------------
# HTTP → HTTPS apex (covers www and non-www on port 80)
# --------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name vyntechsolutions.ca www.vyntechsolutions.ca;
    return 301 https://vyntechsolutions.ca$request_uri;
}

# --------------------------------------------------------------------------
# HTTPS www → HTTPS apex (301) — required for SEO duplicate-host fix
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.vyntechsolutions.ca;

    # Adjust paths if your Certbot live name differs (check: ls /etc/letsencrypt/live/)
    ssl_certificate     /etc/letsencrypt/live/vyntechsolutions.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyntechsolutions.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vyntechsolutions.ca$request_uri;
}

# --------------------------------------------------------------------------
# HTTPS apex → Next.js app
# --------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vyntechsolutions.ca;

    ssl_certificate     /etc/letsencrypt/live/vyntechsolutions.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vyntechsolutions.ca/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
